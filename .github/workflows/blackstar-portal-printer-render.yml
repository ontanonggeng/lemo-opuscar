name: BLACKSTAR - Portal Printer full render

on:
  push:
    branches:
      - blackstar/short-portal-printer
    paths:
      - 'films/portal-printer/**'
      - '.github/workflows/blackstar-portal-printer-render.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackstar-portal-printer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PROJECT: films/portal-printer
      LEMO_ANGLE: swiftshader
      LEMO_COLOR: bt709

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: FFmpeg 7.1
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: media
          create-args: ffmpeg=7.1

      - name: Install Lemo renderer and offline voice tier
        run: |
          sh plugin/skills/lemo-opuscar/scripts/setup.sh deps voice
          node node_modules/playwright-core/cli.js install-deps chromium
          sh styles/scifi-toon/demo/tools/fonts.sh
          ffmpeg -version | head -1
          .venv/bin/python --version

      - name: Restore BLACKSTAR v5 brand
        run: |
          .venv/bin/python -m pip install --quiet pillow shapely cairosvg
          .venv/bin/python brand/blackstar/bootstrap.py
          test -s brand/blackstar/v5/video/corner-watermark-white-512.png

      - name: Source integrity
        run: |
          node --check "$PROJECT/main.js"
          node --check "$PROJECT/cast.js"
          node --check "$PROJECT/world.js"
          node --check "$PROJECT/srt.mjs"
          .venv/bin/python -m py_compile "$PROJECT/voice.py" "$PROJECT/music.py" "$PROJECT/mix.py" "$PROJECT/verify.py"
          ! grep -RniE 'createLinearGradient|createRadialGradient' "$PROJECT" --include='*.js'
          ! grep -RniE 'Vask|Gary|Coffee Run' "$PROJECT" --exclude='STYLE_COMPLIANCE.md'

      - name: Generate Kokoro cast and verify every line
        run: |
          mkdir -p "$PROJECT/out/raw" "$PROJECT/voices"
          .venv/bin/python core/tts/tts.py "$PROJECT/lines.json" "$PROJECT/out/raw"
          .venv/bin/python "$PROJECT/voice.py"
          .venv/bin/python core/tts/asr_check.py "$PROJECT/lines.json" "$PROJECT/voices" --lang en --model base.en

      - name: Score, sound mix and subtitles
        run: |
          .venv/bin/python "$PROJECT/music.py"
          .venv/bin/python "$PROJECT/mix.py"
          node "$PROJECT/srt.mjs"
          test -s "$PROJECT/out/mix.wav"
          test -s "$PROJECT/out/subtitles_en.srt"

      - name: Preflight key film frames
        run: |
          mkdir -p "$PROJECT/preflight"
          node core/render/still.mjs "$PROJECT" 0.5 3.4 7.4 11.1 15.3 18.8 23.6 29.0 33.8 35.5 40.6 42.4 --q 'mode=film' --out "$PROJECT/preflight" --size 540x960

      - name: Render native 1080x1920 film
        run: |
          node core/render/video.mjs "$PROJECT" --q 'mode=film' --fps 24 --workers 3 --size 1080x1920 --out "$PROJECT/out/picture.mp4"
          sh core/render/mux.sh "$PROJECT/out/picture.mp4" "$PROJECT/out/mix.wav" "$PROJECT/out/portal-printer.mp4" 24 0

      - name: Verify actual final movie
        run: |
          .venv/bin/python "$PROJECT/verify.py"

      - name: Upload final candidate and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLACKSTAR-Portal-Printer-${{ github.run_id }}
          path: |
            films/portal-printer/out/portal-printer.mp4
            films/portal-printer/out/subtitles_en.srt
            films/portal-printer/out/contact-sheet.jpg
            films/portal-printer/out/action-strip-*.jpg
            films/portal-printer/out/media-qa.json
            films/portal-printer/voices/dur.json
            films/portal-printer/voices/words.json
            films/portal-printer/preflight/*.jpg
          if-no-files-found: warn
          retention-days: 14
