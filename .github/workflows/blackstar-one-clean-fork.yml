name: BLACKSTAR - One Clean Fork (scifi-toon + Kokoro)

on:
  push:
    branches:
      - blackstar/short-one-clean-fork
    paths:
      - 'films/one-clean-fork/**'
      - '.github/workflows/blackstar-one-clean-fork.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackstar-one-clean-fork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PROJECT: films/one-clean-fork
      LEMO_ANGLE: swiftshader
      LEMO_COLOR: bt709

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: FFmpeg 7.1
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: media
          create-args: ffmpeg=7.1

      - name: Install renderer, Kokoro and Whisper
        run: |
          sh plugin/skills/lemo-opuscar/scripts/setup.sh deps voice
          node node_modules/playwright-core/cli.js install-deps chromium

      - name: Restore official BLACKSTAR v5 brand assets
        run: |
          .venv/bin/python -m pip install --quiet 'numpy<3' pillow shapely cairosvg
          .venv/bin/python brand/blackstar/bootstrap.py
          test -s brand/blackstar/v5/video/corner-watermark-white-512.png

      - name: Static production checks
        run: |
          node --check "$PROJECT/main.js"
          node --check "$PROJECT/chars.js"
          node --check "$PROJECT/story.js"
          node --check "$PROJECT/srt.mjs"
          .venv/bin/python -m py_compile "$PROJECT/voice.py" "$PROJECT/asr.py" "$PROJECT/mix.py" "$PROJECT/verify.py"
          ! grep -rniE 'rick|morty|lemo ?lab|opus 5\.5' "$PROJECT" --exclude=CREDITS
          grep -q 'amp:1.7' "$PROJECT/main.js"
          grep -q 'Baloo 2' "$PROJECT/main.js"
          grep -q 'corner-watermark-white-512.png' "$PROJECT/main.js"

      - name: Fetch fonts
        run: sh "$PROJECT/tools/fonts.sh"

      - name: Generate and verify complete Kokoro dialogue
        run: |
          mkdir -p "$PROJECT/out/raw" "$PROJECT/voices"
          .venv/bin/python core/tts/tts.py "$PROJECT/lines.json" "$PROJECT/out/raw"
          .venv/bin/python "$PROJECT/voice.py"
          .venv/bin/python "$PROJECT/asr.py"

      - name: Mix original score and sound
        run: .venv/bin/python "$PROJECT/mix.py"

      - name: Subtitle export
        run: node "$PROJECT/srt.mjs"

      - name: Preflight representative frames
        run: |
          node core/render/still.mjs "$PROJECT" 0.3 2.9 6.2 10.8 13.5 17.2 21.2 25.1 28.0 32.9 35.5 39.1 41.2 43.0 45.1 47.1 --size 540x960 --out "$PROJECT/preflight"

      - name: Render native vertical picture
        run: node core/render/video.mjs "$PROJECT" --fps 24 --workers 3 --size 1080x1920 --out "$PROJECT/out/picture.mp4"

      - name: Master audio and mux
        run: sh core/render/mux.sh "$PROJECT/out/picture.mp4" "$PROJECT/out/mix.wav" "$PROJECT/out/one-clean-fork.mp4" 24 0

      - name: Final QA and action strips
        run: .venv/bin/python "$PROJECT/verify.py"

      - name: Upload film and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLACKSTAR-One-Clean-Fork-${{ github.run_id }}
          path: |
            films/one-clean-fork/out/one-clean-fork.mp4
            films/one-clean-fork/out/one-clean-fork.srt
            films/one-clean-fork/out/contact-sheet.jpg
            films/one-clean-fork/out/strip-*.jpg
            films/one-clean-fork/out/qa.json
            films/one-clean-fork/voices/asr-report.json
            films/one-clean-fork/preflight/*.jpg
          if-no-files-found: warn
          retention-days: 14
