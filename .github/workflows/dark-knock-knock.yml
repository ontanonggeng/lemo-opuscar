name: BLACKSTAR Dark Knock-Knock Film
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dark-knock-knock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  film:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      LEMO_ANGLE: swiftshader
      LEMO_COLOR: bt709
    steps:
      - name: Checkout film project
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: FFmpeg 7
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: media
          create-args: ffmpeg=7.1

      - name: Restore exact owner-provided BLACKSTAR v5 kit
        run: |
          python -m pip install 'numpy<3' pillow shapely cairosvg
          python brand/blackstar/bootstrap.py

      - name: Install Lemo-Opuscar and Chromium
        run: |
          sh plugin/skills/lemo-opuscar/scripts/setup.sh deps
          node node_modules/playwright-core/cli.js install-deps chromium

      - name: Render with generated ElevenLabs voices
        run: |
          sh films/dark-knock-knock/build.sh

      - name: Verify film resolution audio branding and duration
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          video = pathlib.Path('films/dark-knock-knock/out/dark-knock-knock.mp4')
          data = json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(video)], text=True))
          tracks = data['streams']
          vs = [s for s in tracks if s['codec_type']=='video']
          au = [s for s in tracks if s['codec_type']=='audio']
          assert len(vs)==1 and len(au)>=1, 'Missing video/audio streams'
          assert vs[0]['width']==540 and vs[0]['height']==960, 'Aspect ratio mismatch'
          duration=float(data['format']['duration'])
          assert 50<=duration<=78, f'Incorrect duration: {duration}'
          for fname in ('doris.mp3','nix.mp3'):
              f=pathlib.Path('films/dark-knock-knock/assets')/fname
              assert f.is_file() and f.stat().st_size>10000, f'ElevenLabs voice missing: {fname}'
          assert pathlib.Path('brand/blackstar/v5/video/end-card-black-9x16.png').is_file(), 'BLACKSTAR v5 end card missing'
          print('PASS',video,'duration',duration,'resolution 540x960; original ElevenLabs voices and BLACKSTAR v5 end card')
          PY

      - name: Upload final film and regenerated brand kit
        uses: actions/upload-artifact@v4
        with:
          name: blackstar-dark-knock-knock-${{ github.run_id }}
          path: |
            films/dark-knock-knock/out/dark-knock-knock.mp4
            films/dark-knock-knock/out/dark-knock-knock.srt
            films/dark-knock-knock/out/timeline.json
            brand/blackstar/blackstar-brand-kit-v5.zip
          if-no-files-found: error
          retention-days: 14

      - name: Save ElevenLabs MP3s and brand-kit source to GitHub
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f films/dark-knock-knock/assets/doris.mp3 films/dark-knock-knock/assets/nix.mp3
          git add -f brand/blackstar/source/build_blackstar_v5.py brand/blackstar/blackstar-brand-kit-v5.zip
          git add -f brand/blackstar/v5/masters/*.svg
          if git diff --cached --quiet; then
            echo 'Voice masters and brand kit already versioned'
          else
            git commit -m 'assets: preserve ElevenLabs voice masters and BLACKSTAR v5 kit'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
