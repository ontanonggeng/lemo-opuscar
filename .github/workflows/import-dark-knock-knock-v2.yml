name: BLACKSTAR V2 — Import Complete ElevenLabs Cues

on:
  push:
    branches: [film/dark-knock-knock-v2-repair]
    paths: [".github/workflows/import-dark-knock-knock-v2.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install FFprobe for MP3 validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download and validate all 31 independent speech clips
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, time, urllib.parse, urllib.request
          manifest=pathlib.Path('films/dark-knock-knock/v2-download-once.json')
          clips=json.loads(manifest.read_text())['cues']
          assert len(clips)==31 and [c['id'] for c in clips]==list(range(1,32))
          dest=pathlib.Path('films/dark-knock-knock/voice-v2')
          dest.mkdir(parents=True,exist_ok=True)
          for item in clips:
              p=dest/f"{item['id']:02}.mp3"
              if p.is_file() and p.stat().st_size>1000:
                  continue
              u=urllib.parse.urlsplit(item['url'])
              assert u.scheme=='https' and u.netloc=='elevenlabsusercontent.com'
              last=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(item['url'],headers={'User-Agent':'BLACKSTAR-V2-Audio-Archive/1.0'})
                      with urllib.request.urlopen(req,timeout=50) as response:
                          payload=response.read(3_000_001)
                      assert 1_000<len(payload)<3_000_001, 'Audio response malformed'
                      p.write_bytes(payload)
                      out=subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(p)],text=True)
                      d=float(out.strip())
                      assert d>=.4, 'Too short to contain the requested line'
                      print(f"Cue {item['id']:02d}: {len(payload)} bytes, {d:.2f} s")
                      break
                  except Exception as e:
                      last=e
                      p.unlink(missing_ok=True)
                      time.sleep(attempt+1)
              else:
                  raise RuntimeError(f"Missing cue {item['id']}: {last}")
          assert len(list(dest.glob('*.mp3')))==31
          print('PASS: 31 separately generated audio clips, no boundary slicing')
          PY

      - name: Archive immutable voice assets; remove temporary signed links
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f films/dark-knock-knock/voice-v2/*.mp3
          git rm films/dark-knock-knock/v2-download-once.json
          git commit -m "assets: preserve all 31 complete ElevenLabs V2 voice cues"
          git push origin HEAD:film/dark-knock-knock-v2-repair
